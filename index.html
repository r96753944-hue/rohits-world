<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit's Racing Game</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { color: #00ffcc; }

.game {
  width: 320px;
  max-width: 95vw;
  margin: auto;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin: 10px 0;
  font-size: 14px;
}

#road {
  width: 100%;
  height: 440px;
  background: #444;
  border-left: 7px solid white;
  border-right: 7px solid white;
  position: relative;
  overflow: hidden;
}

.line {
  position: absolute;
  left: 50%;
  top: -100px;
  height: 650px;
  border-left: 5px dashed white;
  transform: translateX(-50%);
}

.car {
  position: absolute;
  width: 42px;
  height: 65px;
  border-radius: 10px;
  border: 3px solid white;
}

#player {
  bottom: 15px;
  left: 132px;
  background: #00e5ff;
}

.enemy {
  background: #ff3333;
}

button {
  border: none;
  padding: 12px 18px;
  margin: 5px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

#startBtn { background: #00ff88; }
#leftBtn, #rightBtn { background: #ffcc00; }
#nitroBtn { background: #ff6600; color: white; }

#message {
  margin: 10px;
  color: #00ffcc;
}
</style>
</head>

<body>

<h1>🏎️ ROHIT'S RACING</h1>

<div class="game">

  <div class="stats">
    <span>🏆 Score: <b id="score">0</b></span>
    <span>🪙 Coins: <b id="coins">0</b></span>
    <span>⚡ Nitro: <b id="nitro">3</b></span>
  </div>

  <div id="road">
    <div class="line" id="line"></div>
    <div class="car" id="player"></div>
  </div>

  <p id="message">START दबाकर रेस शुरू करो!</p>

  <button id="startBtn">▶ START</button>
  <br>
  <button id="leftBtn">⬅ LEFT</button>
  <button id="rightBtn">RIGHT ➡</button>
  <br>
  <button id="nitroBtn">⚡ NITRO</button>

  <p>🚗 दुश्मन की कार से बचो और Coins इकट्ठा करो!</p>

</div>

<script>
const road = document.getElementById("road");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const nitroText = document.getElementById("nitro");
const message = document.getElementById("message");

let running = false;
let x = 132;
let score = 0;
let coins = 0;
let nitro = 3;
let enemies = [];
let lastTime = 0;
let spawnTimer = 0;
let animationId = 0;
let nitroUntil = 0;

function startGame() {
  cancelAnimationFrame(animationId);

  enemies.forEach(enemy => enemy.element.remove());
  enemies = [];

  x = road.clientWidth / 2 - 21;
  score = 0;
  coins = 0;
  nitro = 3;
  spawnTimer = 0;
  lastTime = 0;
  nitroUntil = 0;
  running = true;

  player.style.left = x + "px";

  scoreText.textContent = score;
  coinsText.textContent = coins;
  nitroText.textContent = nitro;
  message.textContent = "रेस शुरू! कारों से बचो!";

  animationId = requestAnimationFrame(loop);
}

function move(direction) {
  if (!running) return;

  x += direction * 25;

  const maxX = road.clientWidth - player.offsetWidth;
  x = Math.max(0, Math.min(maxX, x));
