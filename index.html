<!DOCTYPE html>
<html lang="hi">
<head>
  <link rel="manifest" href="/rohits-world/manifest.json">
<meta name="theme-color" content="#00ffcc">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit's Racing Game</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { color: #00ffcc; }

.game {
  width: 320px;
  max-width: 95vw;
  margin: auto;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin: 10px 0;
  font-size: 14px;
}

#road {
  width: 100%;
  height: 440px;
  background: #444;
  border-left: 7px solid white;
  border-right: 7px solid white;
  position: relative;
  overflow: hidden;
}

.line {
  position: absolute;
  left: 50%;
  top: -100px;
  height: 650px;
  border-left: 5px dashed white;
  transform: translateX(-50%);
}

.car {
  position: absolute;
  width: 42px;
  height: 65px;
  border-radius: 10px;
  border: 3px solid white;
}

#player {
  bottom: 15px;
  left: 132px;
  background: #00e5ff;
}

.enemy {
  background: #ff3333;
}

button {
  border: none;
  padding: 12px 18px;
  margin: 5px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

#startBtn { background: #00ff88; }
#leftBtn, #rightBtn { background: #ffcc00; }
#nitroBtn { background: #ff6600; color: white; }

#message {
  margin: 10px;
  color: #00ffcc;
}
</style>
</head>

<body>

<h1>🏎️ ROHIT'S RACING</h1>

<div class="game">

  <div class="stats">
    <span>🏆 Score: <b id="score">0</b></span>
    <span>🪙 Coins: <b id="coins">0</b></span>
    <span>⚡ Nitro: <b id="nitro">3</b></span>
  </div>

  <div id="road">
    <div class="line" id="line"></div>
    <div class="car" id="player"></div>
  </div>

  <p id="message">START दबाकर रेस शुरू करो!</p>

  <button id="startBtn">▶ START</button>
  <br>
  <button id="leftBtn">⬅ LEFT</button>
  <button id="rightBtn">RIGHT ➡</button>
  <br>
  <button id="nitroBtn">⚡ NITRO</button>

  <p>🚗 दुश्मन की कार से बचो और Coins इकट्ठा करो!</p>

</div>

<script>
const road = document.getElementById("road");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const nitroText = document.getElementById("nitro");
const message = document.getElementById("message");

let running = false;
let x = 132;
let score = 0;
let coins = 0;
let nitro = 3;
let enemies = [];
let lastTime = 0;
let spawnTimer = 0;
let animationId = 0;
let nitroUntil = 0;

function startGame() {
  cancelAnimationFrame(animationId);

  enemies.forEach(enemy => enemy.element.remove());
  enemies = [];

  x = road.clientWidth / 2 - 21;
  score = 0;
  coins = 0;
  nitro = 3;
  spawnTimer = 0;
  lastTime = 0;
  nitroUntil = 0;
  running = true;

  player.style.left = x + "px";

  scoreText.textContent = score;
  coinsText.textContent = coins;
  nitroText.textContent = nitro;
  message.textContent = "रेस शुरू! कारों से बचो!";

  animationId = requestAnimationFrame(loop);
}

function move(direction) {
  if (!running) return;

  x += direction * 25;

  const maxX = road.clientWidth - player.offsetWidth;
  x = Math.max(0, Math.min(maxX, x));

  player.style.left = x + "px";
}

document.getElementById("leftBtn").addEventListener("click", () => move(-1));
document.getElementById("rightBtn").addEventListener("click", () => move(1));

document.getElementById("nitroBtn").addEventListener("click", () => {
  if (running && nitro > 0) {
    nitro--;
    nitroText.textContent = nitro;
    nitroUntil = performance.now() + 2000;
    message.textContent = "⚡ NITRO BOOST!";
  }
});

document.getElementById("startBtn").addEventListener("click", startGame);

document.addEventListener("keydown", event => {
  if (event.key === "ArrowLeft") move(-1);
  if (event.key === "ArrowRight") move(1);
});

function createEnemy() {
  const element = document.createElement("div");
  element.className = "car enemy";

  const maxX = road.clientWidth - 42;
  const enemyX = Math.random() * maxX;

  element.style.left = enemyX + "px";
  element.style.top = "-70px";

  road.appendChild(element);

  enemies.push({
    element: element,
    x: enemyX,
    y: -70
  });
}

function loop(time) {
  if (!running) return;

  if (!lastTime) lastTime = time;

  const delta = Math.min((time - lastTime) / 16.67, 2);
  lastTime = time;

  const boosting = time < nitroUntil;
  const speed = boosting ? 9 : 4;

  spawnTimer += delta;

  if (spawnTimer > 38) {
    createEnemy();
    spawnTimer = 0;
  }

  enemies.forEach(enemy => {
    enemy.y += speed * delta;
    enemy.element.style.top = enemy.y + "px";

    const playerY = road.clientHeight - 15 - player.offsetHeight;

    const hit =
      enemy.x < x + player.offsetWidth - 5 &&
      enemy.x + enemy.element.offsetWidth > x + 5 &&
      enemy.y < playerY + player.offsetHeight - 5 &&
      enemy.y + enemy.element.offsetHeight > playerY + 5;

    if (hit) {
      gameOver();
    }

    if (enemy.y > road.clientHeight) {
      enemy.element.remove();
      enemy.remove = true;
      coins++;
      coinsText.textContent = coins;
    }
  });

  enemies = enemies.filter(enemy => !enemy.remove);

  score += boosting ? 2 : 1;
  scoreText.textContent = score;

  if (running) {
    animationId = requestAnimationFrame(loop);
  }
}

function gameOver() {
  running = false;
  cancelAnimationFrame(animationId);

  message.textContent = "🏁 GAME OVER! फिर से START दबाओ।";
}
</script>

</body>
</html>
