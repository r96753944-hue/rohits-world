<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rohit's Ultimate Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;text-align:center;font-family:Arial;background:#10152f;color:white}
h1{color:#00ffd0}
.panel{margin:10px;padding:10px;background:#20294a;border-radius:12px}
#road{width:300px;height:420px;margin:auto;position:relative;overflow:hidden;background:#454545;border:5px solid white;border-radius:12px}
.line{position:absolute;left:145px;width:6px;height:65px;background:white}
.car{position:absolute;font-size:35px;width:45px;text-align:center}
#player{bottom:12px;left:125px}
.enemy,.coin{top:-50px}
button,select{padding:11px;margin:4px;border:0;border-radius:9px;font-weight:bold}
button{background:#00ffd0;color:#10152f}
#nitro{background:#ffb000}
</style>
</head>
<body>
<h1>🏎️ ROHIT'S RACING</h1>
<div class="panel">
🏆 Score: <span id="score">0</span> |
🪙 Coins: <span id="coins">0</span><br>
⭐ Best: <span id="best">0</span>
</div>
<div class="panel">
कार चुनो:
<select id="choice" onchange="changeCar()">
<option value="🏎️">Supercar</option>
<option value="🚗">Classic</option>
<option value="🚙">SUV</option>
<option value="🏎️">Racer</option>
</select>
</div>
<div id="road">
<div class="line" style="top:20px"></div>
<div class="line" style="top:150px"></div>
<div class="line" style="top:280px"></div>
<div class="car" id="player">🏎️</div>
</div>
<div>
<button onclick="move(-1)">⬅️ LEFT</button>
<button onclick="move(1)">RIGHT ➡️</button>
</div>
<div>
<button id="nitro" onclick="boost()">🚀 NITRO</button>
<button onclick="start()">▶ START / RESTART</button>
<button onclick="soundToggle()">🔊 SOUND</button>
</div>
<p id="msg">START दबाकर रेस शुरू करो!</p>
<script>
const road=document.getElementById('road');
const player=document.getElementById('player');
let lane=1,score=0,coins=0,running=false,speed=4;
let enemies=[],items=[],loop,timer,boosting=false,soundOn=true,audio;
let best=Number(localStorage.getItem('rohitBest')||0);
document.getElementById('best').textContent=best;
document.getElementById('coins').textContent=Number(localStorage.getItem('rohitCoins')||0);

function beep(freq=500){
 if(!soundOn)return;
 try{
  audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  const o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=freq;g.gain.value=.05;
  o.connect(g);g.connect(audio.destination);o.start();
  o.stop(audio.currentTime+.12);
 }catch(e){}
}
function move(d){
 if(!running)return;
 lane=Math.max(0,Math.min(2,lane+d));
 player.style.left=(35+lane*90)+'px';beep(300);
}
function changeCar(){player.textContent=document.getElementById('choice').value}
function soundToggle(){soundOn=!soundOn;document.getElementById('msg').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF'}

 boosting=true;speed=9;document.getElementById('msg').textContent='🚀 NITRO BOOST!';
